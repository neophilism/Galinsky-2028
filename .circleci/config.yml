version: 2.1

# Port of the existing campaign application CI without removing browser,
# PostgreSQL integration, accessibility-relevant browser journeys, or audit.
jobs:
  full-verification:
    docker:
      - image: cimg/node:22.23.3-browsers
      - image: cimg/postgres:16.10
        environment:
          POSTGRES_USER: g28test
          POSTGRES_PASSWORD: g28local
          POSTGRES_DB: g28test
    resource_class: large
    environment:
      CI: "true"
      TEST_DATABASE_URL: postgresql://g28test:g28local@127.0.0.1:5432/g28test
    steps:
      - checkout
      - run:
          name: Install exact dependency lock
          command: npm ci --no-fund
      - run:
          name: Validate syntax and publishing boundary
          command: npm run check
      - run:
          name: TypeScript validation
          command: npm run typecheck
      - run:
          name: All unit tests
          command: npm test
      - run:
          name: HTTP, worker and PostgreSQL integration
          command: npm run test:api
      - run:
          name: Astro and React production builds
          command: npm run build
      - run:
          name: Install Chromium, Firefox and WebKit
          command: npx playwright install --with-deps chromium firefox webkit
      - run:
          name: Cross-browser end-to-end journeys
          command: npm run test:browser
      - run:
          name: Audit production dependencies (high or critical)
          command: npm audit --omit=dev --audit-level=high
      - store_artifacts:
          path: test-results/browser
          destination: cross-browser-evidence
      - store_artifacts:
          path: dist/web
          destination: public-preview

  security-status-record:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - run:
          name: Validate E2EESA status record (integrity only, not certification)
          command: python3 scripts/validate_e2eesa_status.py

workflows:
  full-ci:
    jobs:
      - full-verification
      - security-status-record
