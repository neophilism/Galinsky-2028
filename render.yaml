# PRIVATE preview only. Create services ONLY inside the separately designated
# Galinsky 2028 Render project/environment, not a default workspace.
# Existing static/CDN deployment of dist/web would bypass password protection.
# Auto-deploy is disabled until the owner sets a strong Render secret and reviews placement.
services:
  - type: web
    runtime: node
    name: galinsky-2028-private-preview
    repo: https://github.com/neophilism/Galinsky-2028
    branch: main
    plan: free
    region: ohio
    autoDeployTrigger: off
    buildCommand: npm ci && npm run build:web
    startCommand: npm run preview:serve
    envVars:
      - key: NODE_VERSION
        value: 22.23.3
      - key: G28_PUBLIC_MODE
        value: preview
      - key: PREVIEW_ACCESS_USER
        value: preview
      - key: PREVIEW_ACCESS_PASSWORD
        sync: false
