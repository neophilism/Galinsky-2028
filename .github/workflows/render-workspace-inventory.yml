name: Read-only Render workspace project inventory
on:
  push:
    branches: [main]
    paths:
      - ops/render-workspace-inventory-request.json
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      G28_RENDER_API_KEY: ${{ secrets.G28_RENDER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: List all Render projects and their assigned services; no writes
        run: node scripts/render-workspace-inventory.mjs
