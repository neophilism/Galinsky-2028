name: Authorized Render duplicate cleanup
on:
  push:
    branches: [main]
    paths:
      - ops/render-workspace-cleanup-request.json
permissions:
  contents: read
concurrency:
  group: authorized-render-five-service-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.repository == 'neophilism/Galinsky-2028' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      G28_RENDER_API_KEY: ${{ secrets.G28_RENDER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Validate five exact IDs and retained services; then perform requested operation
        run: node scripts/render-workspace-cleanup.mjs
