name: Verify live real volunteer entry across both services
on:
  push:
    branches: [main]
    paths:
      - ops/real-volunteer-entry-acceptance.json
permissions:
  contents: read
jobs:
  accept:
    if: github.repository == 'neophilism/Galinsky-2028' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      G28_PREVIEW_ACCESS_PASSWORD: ${{ secrets.G28_PREVIEW_ACCESS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Verify public landing, canonical roles and database readiness
        run: node scripts/verify-live-volunteer-entry.mjs
