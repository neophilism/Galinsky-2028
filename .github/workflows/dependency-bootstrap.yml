name: Prepare validation dependencies
on:
  push:
    branches: ['build/campaign-foundation']
    paths: ['.github/workflows/dependency-bootstrap.yml']
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Resolve pinned public packages only
        run: |
          mkdir validation-dependencies
          cd validation-dependencies
          printf '%s\n' '{"name":"galinsky-2028","version":"0.1.0","private":true,"type":"module","dependencies":{"astro":"7.3.8","fastify":"5.12.0","pg":"8.16.3","react":"19.3.0","react-dom":"19.3.0"},"devDependencies":{"typescript":"6.0.3","vite":"8.3.1","@types/react":"19.2.2","@types/react-dom":"19.2.2","@types/node":"22.18.6"}}' > package.json
          npm install --no-fund --no-audit
          npm ls --depth=0
          npm audit --json > audit.json || true
          tar -czf ../validation-dependencies.tgz node_modules package-lock.json audit.json
          cd ..
          sha256sum validation-dependencies.tgz > validation-dependencies.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validation-dependencies
          path: |
            validation-dependencies.tgz
            validation-dependencies.sha256
          retention-days: 3
          if-no-files-found: error
