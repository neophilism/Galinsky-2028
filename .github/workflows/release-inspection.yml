name: Inspect exact Galinsky release without secret output
on:
  push:
    branches: [main]
    paths: [ops/release-inspection-request.json]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: galinsky-read-only-release-inspection
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'neophilism/Galinsky-2028' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      G28_RENDER_API_KEY: ${{ secrets.G28_RENDER_API_KEY }}
      G28_PREVIEW_ACCESS_PASSWORD: ${{ secrets.G28_PREVIEW_ACCESS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - name: Read only exact service placement, secret presence, runtime role and protected health
        run: node scripts/inspect-release.mjs
