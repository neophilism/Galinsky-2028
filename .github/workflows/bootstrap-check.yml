name: Bootstrap availability
on:
  push:
    branches: ['build/campaign-foundation']
permissions:
  contents: read
jobs:
  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify build runner and package access
        run: |
          node --version
          npm --version
          python3 --version
          npm view astro@7.3.8 version
          npm view fastify@5.12.0 version
          npm view react@19.3.0 version
