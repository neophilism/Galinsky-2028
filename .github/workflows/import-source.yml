name: Import verified Galinsky 2028 foundation
on:
  push:
    branches:
      - build/campaign-foundation
    paths:
      - .g28-import/**
      - .github/workflows/import-source.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: g28-foundation-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: g28test
          POSTGRES_PASSWORD: g28local
          POSTGRES_DB: g28test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U g28test -d g28test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://g28test:g28local@127.0.0.1:5432/g28test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and extract source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, tarfile
          chunks=sorted(Path('.g28-import/parts').glob('part-*.bin'))
          if len(chunks) != 23 or [p.name for p in chunks] != [f'part-{i:02d}.bin' for i in range(23)]:
              raise SystemExit('Import requires exactly 23 correctly ordered source pieces')
          payload=b''.join(p.read_bytes() for p in chunks)
          digest=hashlib.sha256(payload).hexdigest()
          if digest != '05f1b48c44947a012bc0b86140efe9d31a90ccbcac2b44a7db97212d6d5bab58':
              raise SystemExit('Source archive digest mismatch: '+digest)
          Path('/tmp/g28-source.tar.xz').write_bytes(payload)
          with tarfile.open('/tmp/g28-source.tar.xz',mode='r:xz') as t:
              members=t.getmembers()
              for member in members:
                  parts=Path(member.name).parts
                  if member.name.startswith('/') or '..' in parts or not (member.isfile() or member.isdir()):
                      raise SystemExit('Unsafe archive member: '+member.name)
                  if member.name.startswith('.git/') or member.name.startswith('.github/'):
                      raise SystemExit('Archive may not replace Git metadata or CI workflows')
              t.extractall('.',filter='data')
          print('Verified archive',digest,'with',len(members),'entries')
          PY
          rm -rf .g28-import
          rm .github/workflows/import-source.yml
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - name: Produce reproducible lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Clean dependency install
        run: npm ci --no-fund
      - name: Validate source and types
        run: npm run check && npm run typecheck
      - name: Unit and HTTP/database tests
        run: npm test && npm run test:api
      - name: Build marketing site and portal
        run: npm run build
      - name: Dependency production audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit verified application source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No import changes"
          else
            git commit -m "feat: import verified campaign website, volunteer portal and tests"
            git push origin HEAD:build/campaign-foundation
          fi
