name: Create private preview in exact Galinsky Render project
on:
  workflow_dispatch:
    inputs:
      action:
        description: Inspect project first, then create password-locked preview
        type: choice
        required: true
        options:
          - inspect
          - create
      environment_id:
        description: Leave blank if project has one environment; otherwise use its exact env- ID
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: galinsky-2028-render-project-provision
  cancel-in-progress: false
jobs:
  render-project:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      G28_RENDER_ACTION: ${{ inputs.action }}
      G28_RENDER_ENVIRONMENT_ID: ${{ inputs.environment_id }}
      G28_RENDER_API_KEY: ${{ secrets.G28_RENDER_API_KEY }}
      G28_PREVIEW_ACCESS_PASSWORD: ${{ secrets.G28_PREVIEW_ACCESS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Inspect verified Render project or create password-locked service in its environment
        run: node scripts/render-project-preview.mjs
