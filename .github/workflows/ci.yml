name: Campaign application CI
on:
  push:
    branches:
      - main
      - build/campaign-foundation
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: g28test
          POSTGRES_PASSWORD: g28local
          POSTGRES_DB: g28test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U g28test -d g28test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://g28test:g28local@127.0.0.1:5432/g28test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - name: Install dependencies from committed lockfile
        run: npm ci --no-fund
      - name: Syntax, publishing boundary, TypeScript
        run: npm run check && npm run typecheck
      - name: Unit tests
        run: npm test
      - name: HTTP, worker and PostgreSQL integration
        run: npm run test:api
      - name: Build Astro and React applications
        run: npm run build
      - name: Browser engines and dependencies
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Real HTTP browser journeys
        run: npm run test:browser
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: galinsky-2028-browser-evidence
          path: test-results/browser/
          if-no-files-found: ignore
          retention-days: 7
