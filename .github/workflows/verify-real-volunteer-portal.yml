name: Verify real protected Galinsky volunteer portal
on:
  push:
    branches: [main]
    paths:
      - ops/portal-staging-acceptance-request.json
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'neophilism/Galinsky-2028' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PREVIEW_ACCESS_PASSWORD: ${{ secrets.G28_PREVIEW_ACCESS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Verify browser password, actual Fastify API, Neon readiness and disabled sensitive gates
        run: node scripts/verify-real-volunteer-portal.mjs
